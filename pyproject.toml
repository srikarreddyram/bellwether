[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bellwether"
version = "3.0.0"
description = "Risk-gated progressive delivery for repositories that need no modification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tejsrikar Reddy" }]
keywords = ["canary", "progressive-delivery", "deployment", "sre", "mlflow"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Build Tools",
]

dependencies = [
  "flask>=3.0,<4",
  "flask-cors>=4.0,<7",
  "flask-socketio>=5.3,<6",
  "python-dotenv>=1.0,<2",
  "requests>=2.31,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
# Full mlflow (not -skinny): the SQLite tracking backend needs SQLAlchemy.
tracking = ["mlflow>=2.9"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-requests",
  "types-PyYAML",
]

[project.scripts]
bellwether = "bellwether.cli:main"

[project.urls]
Homepage = "https://github.com/srikarreddyram/bellwether"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bellwether = ["py.typed", "resources/*.py"]

# ── Lint ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF", "S", "PTH", "RET", "ARG", "BLE"]
ignore = [
  "S101",   # assert — used deliberately in tests
  "RUF012", # mutable class attrs need ClassVar — noisy for handler classes
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ARG"]

[tool.ruff.lint.isort]
known-first-party = ["bellwether"]

# ── Types ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
packages = ["bellwether"]
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["flask_socketio.*", "mlflow.*", "flask_cors.*"]
ignore_missing_imports = true

# ── Tests ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = ["integration: spins up real sockets or subprocesses"]
filterwarnings = ["error::DeprecationWarning:bellwether.*"]

[tool.coverage.run]
source = ["bellwether"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
